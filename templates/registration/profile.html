{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-8 col-lg-6">
    <div class="card auth-card p-4">
      <h3 class="fw-bold mb-1" style="color: var(--cc-dark);">Edit profile</h3>
      <p class="text-muted">Update your personal details.</p>

      <form method="post">
        {% csrf_token %}
        {% for field in form %}
          <div class="mb-3">
            <label class="form-label fw-semibold" for="{{ field.id_for_label }}">{{ field.label }}</label>
            {{ field }}
            {% for error in field.errors %}<div class="text-danger small">{{ error }}</div>{% endfor %}
          </div>
        {% endfor %}
        <button type="submit" class="btn btn-cc w-100 py-2">Save changes</button>
        <a href="{% url 'dashboard' %}" class="btn btn-link w-100 mt-2">Cancel</a>
      </form>
    </div>
  </div>
</div>
{% endblock %}
